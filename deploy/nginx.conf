# 网页版自习室 - Nginx 反向代理示例
# 前端已由 jar 自带（mvn package 自动构建），Nginx 只做反向代理 + WebSocket 升级。
#
# 使用：
#   1. 把本文件放到 /etc/nginx/conf.d/study-room.conf
#   2. 修改 server_name 为你的域名（没有就用服务器 IP）
#   3. sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;   # TODO: 改成你的域名或服务器 IP

    client_max_body_size 6m;       # 与后端 5MB 上传限制 + 余量一致

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket：房间聊天 / 在线状态 / 组队专注实时同步
    location /ws {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
