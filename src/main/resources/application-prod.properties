# ============ 生产环境配置（SPRING_PROFILES_ACTIVE=prod） ============
# 反向代理（Nginx）后获取真实客户端 IP / 协议，限流组件依赖它区分用户 IP
server.forward-headers-strategy=framework

# 日志：写文件并滚动（目录由 deploy.sh 创建并授权）
logging.file.name=${LOG_FILE:/opt/study-room/logs/study-room.log}
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=500MB

# 监控：健康 + Prometheus 指标
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# 安全响应头：CSP / HSTS / 禁止 iframe 嵌入
app.security.headers-enabled=true

# 跨域来源：同源部署一般用不到；前端域名与后端不同时才需要
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
