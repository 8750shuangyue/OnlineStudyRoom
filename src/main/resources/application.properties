spring.application.name=study-room
# 默认端口 8081：本机 8080 常被其他 Java 服务占用
server.port=8081
# 让错误响应携带 message 字段，前端可以展示具体原因
server.error.include-message=always
# 资料上传大小限制（支持 PDF / Word / 文本）
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# 从项目根目录的 .env 文件读取密钥（.env 已被 .gitignore 忽略，不会提交到 Git）
spring.config.import=optional:file:./.env[.properties]

# ---------- 数据库：H2 文件模式，数据保存在 ./data 目录 ----------
spring.datasource.url=jdbc:h2:file:./data/studyroom
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# ---------- 数据库迁移（Flyway） ----------
# 已有库首次接入自动 baseline（不重放历史），后续 schema 变更统一走 db/migration 脚本
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---------- JWT ----------
# 生产环境务必通过 .env 或环境变量覆盖 JWT_SECRET，长度至少 32 个字符
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-before-deploy-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# 刷新令牌有效期：默认 30 天
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# DeepSeek 配置：Key 在 .env 中定义（DEEPSEEK_API_KEY=sk-xxx），也可用系统环境变量传入
# 未设置时使用占位值，应用仍可启动，调用聊天接口会返回 401。
# 服务地址默认 https://api.deepseek.com，无需额外配置
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:sk-REPLACE-ME}
# 可选模型：deepseek-v4-flash（默认）、deepseek-v4-pro、deepseek-chat、deepseek-reasoner
spring.ai.deepseek.chat.model=${DEEPSEEK_CHAT_MODEL:deepseek-v4-flash}
