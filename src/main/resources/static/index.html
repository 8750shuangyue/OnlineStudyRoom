<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自习室 AI 助手</title>
    <style>
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 24px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 640px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 24px;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 16px;
            color: #1f2329;
        }
        textarea {
            width: 100%;
            min-height: 90px;
            box-sizing: border-box;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            resize: vertical;
        }
        button {
            margin-top: 12px;
            padding: 10px 24px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        button:disabled {
            background: #93b4f7;
            cursor: not-allowed;
        }
        .output {
            margin-top: 16px;
            padding: 12px;
            background: #f8fafc;
            border-radius: 8px;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 60px;
            font-size: 14px;
            color: #1f2329;
        }
        .error {
            color: #dc2626;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>自习室 AI 助手（测试页）</h1>
    <textarea id="message" placeholder="输入你想问的问题，例如：帮我解释一下什么是番茄工作法"></textarea>
    <button id="send">发送</button>
    <div class="output" id="output">回答会显示在这里</div>
</div>

<script>
    const sendBtn = document.getElementById('send');
    const messageEl = document.getElementById('message');
    const outputEl = document.getElementById('output');

    sendBtn.addEventListener('click', async () => {
        const message = messageEl.value.trim();
        if (!message) return;

        sendBtn.disabled = true;
        outputEl.textContent = '思考中...';
        outputEl.classList.remove('error');

        try {
            const resp = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            if (!resp.ok) {
                throw new Error(`请求失败（HTTP ${resp.status}），请确认服务端日志`);
            }
            const data = await resp.json();
            outputEl.textContent = data.reply;
        } catch (err) {
            outputEl.textContent = '出错了：' + err.message +
                '（如果返回 401，请检查 .env 里的 DEEPSEEK_API_KEY 是否正确）';
            outputEl.classList.add('error');
        } finally {
            sendBtn.disabled = false;
        }
    });

    messageEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
            sendBtn.click();
        }
    });
</script>
</body>
</html>
